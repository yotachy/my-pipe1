
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.app { font-family: var(--font-sans); background: var(--color-background-tertiary); padding: 12px; }
.phone { max-width: 390px; margin: 0 auto; background: var(--color-background-secondary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); overflow: hidden; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.topbar-title { font-size: 16px; font-weight: 500; color: var(--color-text-primary); }
.badge-live { font-size: 11px; font-weight: 500; background: var(--color-background-success); color: var(--color-text-success); padding: 3px 8px; border-radius: 20px; display: flex; align-items: center; gap: 4px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--color-text-success); animation: blink 1.4s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.cards { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); padding: 16px 18px 18px; }
.card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.card-type { font-size: 10px; font-weight: 500; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.8px; }
.card-src { font-size: 10px; color: var(--color-text-tertiary); }
.card-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 14px; }
.gauge-wrap { display: flex; flex-direction: column; align-items: center; }
.gauge-svg { width: 100%; max-width: 260px; }
.gauge-ends { display: flex; justify-content: space-between; width: 100%; max-width: 260px; margin-top: -2px; }
.gauge-end-txt { font-size: 10px; color: var(--color-text-tertiary); }
.score-block { text-align: center; margin-top: 6px; }
.score-num { font-family: var(--font-mono); font-size: 40px; font-weight: 500; line-height: 1; }
.score-lbl { font-size: 13px; font-weight: 500; margin-top: 3px; }
.score-change { font-size: 11px; color: var(--color-text-tertiary); margin-top: 3px; font-family: var(--font-mono); }
.seg-bar { display: flex; gap: 3px; margin-top: 12px; }
.seg { height: 3px; border-radius: 2px; flex: 1; opacity: 0.25; }
.seg.on { opacity: 1; }
.hist-row { display: flex; gap: 6px; margin-top: 12px; }
.hist-chip { flex: 1; background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 7px 6px; text-align: center; }
.hist-lbl { font-size: 9px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.4px; }
.hist-val { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-top: 2px; }
.skeleton { background: var(--color-background-secondary); border-radius: 4px; animation: shimmer 1.2s infinite; }
@keyframes shimmer { 0%,100%{opacity:0.5} 50%{opacity:1} }
.error-box { text-align: center; padding: 20px 10px; }
.error-txt { font-size: 12px; color: var(--color-text-danger); }
.retry-btn { margin-top: 8px; font-size: 12px; color: var(--color-text-info); background: none; border: none; cursor: pointer; padding: 0; }
.ad { margin: 0 14px 14px; background: var(--color-background-secondary); border: 0.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 8px; text-align: center; font-size: 10px; color: var(--color-text-tertiary); }
.updated { text-align: center; font-size: 10px; color: var(--color-text-tertiary); padding-bottom: 10px; }
</style>

<div class="app">
<div class="phone">
  <div class="topbar">
    <span class="topbar-title">공포 & 탐욕</span>
    <span class="badge-live"><span class="dot"></span>실시간</span>
  </div>
  <div class="cards">
    <div class="card" id="stock-card">
      <div class="card-meta"><span class="card-type">미국 주식시장</span><span class="card-src">CNN</span></div>
      <div class="card-title">공포 & 탐욕 지수</div>
      <div id="stock-body"><div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0"><div class="skeleton" style="width:220px;height:80px;border-radius:8px"></div><div class="skeleton" style="width:80px;height:36px;border-radius:4px"></div><div class="skeleton" style="width:140px;height:14px;border-radius:4px"></div></div></div>
    </div>
    <div class="card" id="crypto-card">
      <div class="card-meta"><span class="card-type">암호화폐</span><span class="card-src">Alternative.me</span></div>
      <div class="card-title">공포 & 탐욕 지수</div>
      <div id="crypto-body"><div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0"><div class="skeleton" style="width:220px;height:80px;border-radius:8px"></div><div class="skeleton" style="width:80px;height:36px;border-radius:4px"></div><div class="skeleton" style="width:140px;height:14px;border-radius:4px"></div></div></div>
    </div>
  </div>
  <div class="ad">광고 영역 — 유료 결제 시 제거됩니다</div>
  <div class="updated" id="updated-txt"></div>
</div>
</div>

<script>
const ZONES = [
  { label:'Extreme Fear', kr:'극도의 공포', color:'#E24B4A', from:0, to:25 },
  { label:'Fear',         kr:'공포',       color:'#EF9F27', from:25, to:45 },
  { label:'Neutral',      kr:'중립',        color:'#888780', from:45, to:55 },
  { label:'Greed',        kr:'탐욕',        color:'#639922', from:55, to:75 },
  { label:'Extreme Greed',kr:'극도의 탐욕', color:'#1D9E75', from:75, to:100 }
];

function zone(score) {
  return ZONES.find(z => score >= z.from && score < z.to) || ZONES[ZONES.length-1];
}

function gauge(score) {
  const cx=130, cy=95, R=75, sw=9;
  const gap=0.02;
  let paths='';
  ZONES.forEach(z => {
    const a1 = Math.PI*(z.from/100) + gap;
    const a2 = Math.PI*(z.to/100) - gap;
    const s = {x: cx - R*Math.cos(a1), y: cy - R*Math.sin(a1)};
    const e = {x: cx - R*Math.cos(a2), y: cy - R*Math.sin(a2)};
    paths += `<path d="M${s.x},${s.y} A${R},${R} 0 0 1 ${e.x},${e.y}" fill="none" stroke="${z.color}" stroke-width="${sw}" stroke-linecap="round" opacity="0.2"/>`;
    const fillTo = Math.min(score, z.to);
    if (fillTo > z.from) {
      const fa1 = Math.PI*(z.from/100)+gap;
      const fa2 = Math.PI*(fillTo/100)-(score<=z.to?gap:0);
      if(fa2>fa1){
        const fs={x:cx-R*Math.cos(fa1),y:cy-R*Math.sin(fa1)};
        const fe={x:cx-R*Math.cos(fa2),y:cy-R*Math.sin(fa2)};
        paths+=`<path d="M${fs.x},${fs.y} A${R},${R} 0 0 1 ${fe.x},${fe.y}" fill="none" stroke="${z.color}" stroke-width="${sw}" stroke-linecap="round"/>`;
      }
    }
  });
  const na = Math.PI*(score/100);
  const nx = cx - 58*Math.cos(na), ny = cy - 58*Math.sin(na);
  const zn = zone(score);
  return `<svg class="gauge-svg" viewBox="0 0 260 105" xmlns="http://www.w3.org/2000/svg">
    ${paths}
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${zn.color}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="${zn.color}"/>
    <circle cx="${cx}" cy="${cy}" r="2.5" fill="var(--color-background-primary)"/>
  </svg>`;
}

function segBar(score) {
  const zn = zone(score);
  return '<div class="seg-bar">'+ZONES.map(z=>`<div class="seg${z===zn?' on':''}" style="background:${z.color}"></div>`).join('')+'</div>';
}

function render(bodyId, score, prev, w1, m1, y1) {
  const zn = zone(score);
  const diff = score - prev;
  const diffStr = (diff>=0?'+':'')+diff;
  document.getElementById(bodyId).innerHTML = `
    <div class="gauge-wrap">
      ${gauge(score)}
      <div class="gauge-ends"><span class="gauge-end-txt">공포</span><span class="gauge-end-txt">탐욕</span></div>
    </div>
    <div class="score-block">
      <div class="score-num" style="color:${zn.color}">${score}</div>
      <div class="score-lbl" style="color:${zn.color}">${zn.kr}</div>
      <div class="score-change">전일 대비 ${diffStr} · 전일 ${prev}</div>
    </div>
    ${segBar(score)}
    <div class="hist-row">
      <div class="hist-chip"><div class="hist-lbl">1주 전</div><div class="hist-val" style="color:${zone(w1||score).color}">${w1||'—'}</div></div>
      <div class="hist-chip"><div class="hist-lbl">1개월 전</div><div class="hist-val" style="color:${zone(m1||score).color}">${m1||'—'}</div></div>
      <div class="hist-chip"><div class="hist-lbl">1년 전</div><div class="hist-val" style="color:${zone(y1||score).color}">${y1||'—'}</div></div>
    </div>`;
}

function renderError(bodyId, onRetry) {
  document.getElementById(bodyId).innerHTML = `<div class="error-box"><div class="error-txt">데이터를 불러올 수 없습니다</div><button class="retry-btn" onclick="(${onRetry})()">다시 시도 ↻</button></div>`;
}

async function loadCrypto() {
  try {
    const r = await fetch('https://api.alternative.me/fng/?limit=8&format=json', {cache:'no-store'});
    if (!r.ok) throw new Error();
    const j = await r.json();
    const d = j.data;
    render('crypto-body',
      parseInt(d[0].value), parseInt(d[1].value),
      parseInt(d[6]?.value||d[0].value),
      null, null);
  } catch(e) {
    renderError('crypto-body', loadCrypto);
  }
}

async function loadStock() {
  try {
    const r = await fetch('https://production.dataviz.cnn.io/index/fearandgreed/graphdata', {
      cache:'no-store',
      headers:{'Accept':'application/json'}
    });
    if (!r.ok) throw new Error();
    const j = await r.json();
    const fg = j.fear_and_greed;
    render('stock-body',
      Math.round(fg.score),
      Math.round(fg.previous_close),
      Math.round(fg.previous_1_week),
      Math.round(fg.previous_1_month),
      Math.round(fg.previous_1_year));
  } catch(e) {
    renderError('stock-body', loadStock);
  }
}

function updateTime() {
  const now = new Date();
  const t = now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('updated-txt').textContent = `마지막 업데이트 ${t}`;
}

Promise.all([loadCrypto(), loadStock()]).then(updateTime);
setInterval(()=>{ loadCrypto(); loadStock(); updateTime(); }, 60000);
</script>
