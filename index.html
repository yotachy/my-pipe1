<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>이코노미보드 by MoneyScoop</title>
  <meta name="theme-color" content="#f5f5f7"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f5f5f7;--t1:#0d0d0d;--t3:#505050;--t4:#828290;--rule:rgba(0,0,0,.09);--up:#26a69a;--dn:#ef5350;--fl:#787b86;--sans:'Noto Sans KR',sans-serif;--mono:'DM Mono',monospace;--pad:16px;}
    html,body{background:var(--bg);color:var(--t1);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh}
    .hdr-wrap{position:sticky;top:0;z-index:100;background:var(--bg);padding:0 var(--pad)}
    .hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1.5px solid var(--t1);max-width:560px;margin:0 auto}
    .hdr-title{font-size:18px;font-weight:700;letter-spacing:-1px;color:var(--t1);text-decoration:none;white-space:nowrap}
    .btn-group{display:flex;align-items:center;gap:5px;flex-shrink:0}
    .app-btn{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:#fff;background:#000;border:none;border-radius:6px;padding:6px 9px;text-decoration:none;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,0.2)}
    .donate-btn{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--t4);background:none;border:1px solid var(--rule);border-radius:6px;padding:5px 8px;text-decoration:none;white-space:nowrap}
    .shell{max-width:560px;margin:0 auto;padding:20px var(--pad) 60px}
    .sec-hd{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--rule);margin-bottom:12px}
    .sec-lbl{font-size:13px;font-weight:700;color:var(--t1)}
    .row{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);cursor:pointer;border-left:2.5px solid transparent;transition:all .15s}
    .row.on{border-left-color:var(--t1);padding-left:8px;background:rgba(0,0,0,0.01)}
    .lbl{flex:0 0 100px;font-size:13px;font-weight:700;color:var(--t3);display:flex;align-items:center;gap:4px}
    .val{flex:1;text-align:right;font-family:var(--mono);font-size:16px;font-weight:500;color:var(--t1)}
    .chg{flex:0 0 90px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding-left:8px}
    .pct{font-family:var(--mono);font-size:11px;font-weight:700}
    .raw{font-family:var(--mono);font-size:10px;color:var(--t4)}
    .dot{width:5px;height:5px;border-radius:50%;background:var(--fl);opacity:.4}
    .chart-area{display:none;margin:6px 0 14px;padding:14px;background:#fff;border-radius:10px;border:1px solid var(--rule)}
    .canvas-wrap{position:relative;width:100%;height:140px}
    .up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--fl)}
    @media(max-width:380px){.hdr-title{display:none}}
  </style>
</head>
<body>
<div class="hdr-wrap">
  <div class="hdr">
    <a class="hdr-title" href="#">이코노미보드</a>
    <div class="btn-group">
      <a class="app-btn" href="https://play.google.com/store/apps/details?id=com.moneyscoop.cryptopic" target="_blank">크립토보드</a>
      <a class="app-btn" href="#" target="_blank">아파트보드</a>
      <a class="donate-btn" href="https://toss.me/yotachy" target="_blank">후원</a>
    </div>
  </div>
</div>
<div class="shell">
  <div class="sec">
    <div class="sec-hd"><span class="sec-lbl">주요 지수</span></div>
    <div id="idx-list"></div>
  </div>
</div>
<div class="chart-area" id="chart-area"><div class="canvas-wrap"><canvas id="main-canvas"></canvas></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let chartInst = null, activeSym = null;
  const IDX = [
    {sym:'^GSPC', id:'idx-sp500', nm:'S&P 500', d:2},
    {sym:'^IXIC', id:'idx-nasdaq', nm:'NASDAQ', d:2},
    {sym:'^VIX', id:'idx-vix', nm:'VIX', d:2, isVix:true},
    {sym:'^KS11', id:'idx-kospi', nm:'KOSPI', d:2},
    {sym:'^KQ11', id:'idx-kosdaq', nm:'KOSDAQ', d:2}
  ];
  function updateRow(id, price, prev, s) {
    let chg = price - prev, pct = (prev && Math.abs(prev) > 10) ? (chg / Math.abs(prev)) * 100 : 0;
    if(Math.abs(pct) > 15 && !s.isVix) pct = 0; // 지수 등락률 이상치(15% 초과) 강제 보정
    let cls = s.isVix ? (chg > 0 ? 'dn' : 'up') : (chg > 0 ? 'up' : 'dn');
    if(Math.abs(chg) < 0.01) cls = 'fl';
    $(id).innerHTML = `<div class="lbl"><span class="dot"></span>${s.nm}</div><div class="val">${price.toLocaleString('ko-KR',{minimumFractionDigits:s.d})}</div><div class="chg"><span class="pct ${cls}">${chg>0?'▲':chg<0?'▼':'─'} ${Math.abs(pct).toFixed(2)}%</span><span class="raw ${cls}">${chg>=0?'+':''}${chg.toFixed(s.d)}</span></div>`;
  }
  function init() {
    $('idx-list').innerHTML = IDX.map((s,i) => `<div class="row" id="${s.id}" onclick="clickIdx(${i})"></div>`).join('');
    // 초기 더미 데이터 (실제 연동 시 API 호출 결과로 대체)
    IDX.forEach(s => updateRow(s.id, 2550.12, 2540.00, s));
  }
  function clickIdx(i) {
    let s = IDX[i], el = $(s.id), area = $('chart-area');
    if(activeSym === s.id) { area.style.display = 'none'; el.classList.remove('on'); activeSym = null; return; }
    document.querySelectorAll('.row').forEach(r => r.classList.remove('on'));
    el.classList.add('on'); el.parentNode.insertBefore(area, el.nextSibling);
    area.style.display = 'block'; activeSym = s.id;
  }
  init();
</script>
</body>
</html>
